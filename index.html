<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>JARVIS — Official</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020609;
  color:#dffcff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  position:relative;
}

/* FUNDO */

#space{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
}

/* HUD */

.hud{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
}

.top{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
  letter-spacing:2px;
  opacity:.9;
}

.brand{
  color:#7ff7ff;
  font-weight:bold;
}

.status{
  text-align:right;
}

#systemState{
  color:#7ff7ff;
}

#micState{
  color:#9defff;
  margin-top:4px;
}

/* CENTRO */

.core-area{
  position:absolute;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%);
  width:min(88vw,500px);
  height:min(88vw,500px);
  display:flex;
  align-items:center;
  justify-content:center;
}

.core-ring{
  position:absolute;
  width:78%;
  height:78%;
  border:1px solid rgba(100,240,255,.25);
  border-radius:50%;
  box-shadow:
    0 0 25px rgba(0,220,255,.12),
    inset 0 0 25px rgba(0,220,255,.08);
  animation:rotate 18s linear infinite;
}

.core-ring.two{
  width:62%;
  height:62%;
  animation-direction:reverse;
  animation-duration:12s;
}

.core-ring.three{
  width:46%;
  height:46%;
  animation-duration:8s;
}

@keyframes rotate{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

#brain{
  width:100%;
  height:100%;
}

/* TEXTO CENTRAL */

.center-info{
  position:absolute;
  text-align:center;
  pointer-events:none;
}

.logo{
  font-size:28px;
  font-weight:bold;
  letter-spacing:7px;
  color:#b9fbff;
  text-shadow:
    0 0 8px #00dfff,
    0 0 25px rgba(0,220,255,.5);
}

.subtitle{
  margin-top:7px;
  font-size:9px;
  letter-spacing:3px;
  color:#72dce8;
}

/* PAINEL */

.panel{
  position:fixed;
  z-index:5;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  width:min(92vw,520px);
  padding:12px 15px;
  border:1px solid rgba(89,227,255,.22);
  background:rgba(2,12,17,.72);
  backdrop-filter:blur(12px);
  border-radius:15px;
  box-shadow:0 0 25px rgba(0,210,255,.08);
  pointer-events:auto;
}

.listen{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  min-height:28px;
  color:#9df7ff;
  font-size:11px;
  letter-spacing:2px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#52f3ff;
  box-shadow:0 0 12px #52f3ff;
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  0%,100%{opacity:.35;transform:scale(.8)}
  50%{opacity:1;transform:scale(1.15)}
}

.command{
  text-align:center;
  margin-top:7px;
  color:#507c84;
  font-size:9px;
  letter-spacing:1px;
}

/* BOTÃO */

.voice-button{
  position:fixed;
  z-index:7;
  right:18px;
  bottom:115px;
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid rgba(100,240,255,.45);
  background:rgba(2,14,19,.8);
  color:#9df7ff;
  font-size:20px;
  box-shadow:0 0 18px rgba(0,220,255,.12);
  cursor:pointer;
}

.voice-button:active{
  transform:scale(.94);
}

/* BRAIN */

#brainPanel{
  position:fixed;
  z-index:20;
  inset:0;
  background:
    radial-gradient(circle at center,
      rgba(0,180,220,.08),
      rgba(1,5,8,.97) 65%);
  display:none;
  overflow:auto;
  padding:25px 18px;
}

.brain-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.brain-title{
  font-size:18px;
  letter-spacing:4px;
  color:#a8faff;
}

.close-brain{
  border:1px solid rgba(100,240,255,.35);
  background:transparent;
  color:#a8faff;
  padding:8px 12px;
  border-radius:8px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  max-width:600px;
  margin:auto;
}

.stat{
  border:1px solid rgba(100,240,255,.18);
  background:rgba(3,17,22,.75);
  border-radius:12px;
  padding:16px;
}

.stat-name{
  font-size:9px;
  letter-spacing:2px;
  color:#709da4;
}

.stat-value{
  font-size:26px;
  margin-top:7px;
  color:#9ff8ff;
}

.brain-list{
  max-width:600px;
  margin:18px auto;
}

.brain-list h3{
  font-size:10px;
  letter-spacing:2px;
  margin:18px 0 8px;
  color:#75e8f2;
}

.item{
  padding:10px;
  margin-bottom:6px;
  border-left:2px solid #49e8f5;
  background:rgba(5,22,27,.65);
  font-size:11px;
}

/* RESPONSIVO */

@media(max-width:500px){
  .logo{
    font-size:23px;
  }

  .core-area{
    width:95vw;
    height:95vw;
    top:45%;
  }

  .panel{
    bottom:14px;
  }
}
</style>
</head>

<body>

<canvas id="space"></canvas>

<div class="hud">

  <div class="top">

    <div>
      <div class="brand">JARVIS // OFFICIAL</div>
      <div>CORE V3</div>
    </div>

    <div class="status">
      <div id="systemState">INICIALIZANDO</div>
      <div id="micState">MIC: INICIANDO</div>
    </div>

  </div>

  <div class="core-area">

    <div class="core-ring"></div>
    <div class="core-ring two"></div>
    <div class="core-ring three"></div>

    <canvas id="brain"></canvas>

    <div class="center-info">
      <div class="logo">JARVIS</div>
      <div class="subtitle">PERSONAL INTELLIGENCE CORE</div>
    </div>

  </div>

</div>

<div class="panel">

  <div class="listen">
    <span class="dot"></span>
    <span id="listenText">JARVIS ESTÁ INICIANDO...</span>
  </div>

  <div class="command" id="commandText">
    PREPARANDO RECONHECIMENTO DE VOZ
  </div>

</div>

<button class="voice-button" id="voiceButton">
  🎙
</button>

<!-- BRAIN PANEL -->

<div id="brainPanel">

  <div class="brain-header">

    <div class="brain-title">
      JARVIS BRAIN
    </div>

    <button class="close-brain" id="closeBrain">
      FECHAR
    </button>

  </div>

  <div class="stats">

    <div class="stat">
      <div class="stat-name">CONHECIDOS</div>
      <div class="stat-value" id="knownCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-name">APRENDIDOS</div>
      <div class="stat-value" id="learnedCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-name">APRENDENDO</div>
      <div class="stat-value" id="learningCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-name">DESCONHECIDOS</div>
      <div class="stat-value" id="unknownCount">0</div>
    </div>

  </div>

  <div class="brain-list">

    <h3>CONHECIMENTO</h3>
    <div id="knownList"></div>

    <h3>APRENDIZADO</h3>
    <div id="learnedList"></div>

    <h3>EM APRENDIZADO</h3>
    <div id="learningList"></div>

    <h3>DESCONHECIDO</h3>
    <div id="unknownList"></div>

  </div>

</div>

<script type="module">

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const OWNER_NAME = "Fernando";

const MEMORY_KEY =
  "JARVIS_OFFICIAL_MEMORY_V3";

const KNOWLEDGE_KEY =
  "JARVIS_OFFICIAL_KNOWLEDGE_V3";

const SESSION_KEY =
  "JARVIS_OFFICIAL_SESSION_V3";


/* =====================================================
   ELEMENTOS
===================================================== */

const systemState =
  document.getElementById("systemState");

const micState =
  document.getElementById("micState");

const listenText =
  document.getElementById("listenText");

const commandText =
  document.getElementById("commandText");

const voiceButton =
  document.getElementById("voiceButton");

const brainPanel =
  document.getElementById("brainPanel");

const closeBrain =
  document.getElementById("closeBrain");


/* =====================================================
   MEMÓRIA
===================================================== */

let memory = [];

try{

  const saved =
    localStorage.getItem(MEMORY_KEY);

  memory =
    saved ? JSON.parse(saved) : [];

  if(!Array.isArray(memory)){
    memory = [];
  }

}catch{
  memory = [];
}


function saveMemory(){

  try{

    localStorage.setItem(
      MEMORY_KEY,
      JSON.stringify(
        memory.slice(-100)
      )
    );

  }catch{}

}


/* =====================================================
   CONHECIMENTO
===================================================== */

let knowledge = {

  known:[],
  learned:[],
  learning:[],
  unknown:[]

};

try{

  const saved =
    localStorage.getItem(KNOWLEDGE_KEY);

  if(saved){

    const parsed =
      JSON.parse(saved);

    knowledge = {

      known:Array.isArray(parsed.known)
        ? parsed.known : [],

      learned:Array.isArray(parsed.learned)
        ? parsed.learned : [],

      learning:Array.isArray(parsed.learning)
        ? parsed.learning : [],

      unknown:Array.isArray(parsed.unknown)
        ? parsed.unknown : []

    };

  }

}catch{}


function saveKnowledge(){

  try{

    localStorage.setItem(
      KNOWLEDGE_KEY,
      JSON.stringify(knowledge)
    );

  }catch{}

}


/* =====================================================
   SESSÃO
===================================================== */

let session;

try{

  const saved =
    localStorage.getItem(SESSION_KEY);

  if(saved){

    session =
      JSON.parse(saved);

  }else{

    session = {

      id:
        "JARVIS-" +
        Date.now(),

      startedAt:
        new Date().toISOString(),

      questions:0,
      answers:0,
      events:[]

    };

  }

}catch{

  session = {

    id:
      "JARVIS-" +
      Date.now(),

    startedAt:
      new Date().toISOString(),

    questions:0,
    answers:0,
    events:[]

  };

}


function saveSession(){

  try{

    localStorage.setItem(
      SESSION_KEY,
      JSON.stringify(session)
    );

  }catch{}

}


/* =====================================================
   STATUS
===================================================== */

function setState(
  state,
  message
){

  systemState.textContent =
    state;

  commandText.textContent =
    message || "";

}


function setMic(
  state
){

  micState.textContent =
    "MIC: " + state;

  listenText.textContent =
    state;

}


/* =====================================================
   NORMALIZAÇÃO DE TEXTO
===================================================== */

function normalizeText(text){

  return String(text || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[!?.,;:]/g," ")
    .replace(/\s+/g," ")
    .trim();

}


/* =====================================================
   VOZ
===================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;

let recognitionRunning = false;

let speaking = false;

let restarting = false;

let lastSpeechTime = 0;


/* =====================================================
   TTS
===================================================== */

function chooseVoice(){

  const voices =
    speechSynthesis.getVoices();

  if(!voices.length)
    return null;

  const pt =
    voices.filter(
      v =>
        v.lang &&
        v.lang.toLowerCase()
          .startsWith("pt")
    );

  const maleKeywords = [
    "male",
    "masculino",
    "daniel",
    "lucas",
    "jorge",
    "felipe"
  ];

  const male =
    pt.find(
      voice =>
        maleKeywords.some(
          key =>
            voice.name
              .toLowerCase()
              .includes(key)
        )
    );

  return male || pt[0] || voices[0];

}


speechSynthesis.onvoiceschanged =
  () => {};


function speak(text){

  if(!text)
    return;

  try{

    speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(
        String(text)
      );

    utterance.lang =
      "pt-BR";

    utterance.rate =
      0.95;

    utterance.pitch =
      0.72;

    utterance.volume =
      1;

    const voice =
      chooseVoice();

    if(voice)
      utterance.voice = voice;

    speaking = true;

    setState(
      "RESPONDENDO",
      "JARVIS ESTÁ FALANDO"
    );

    setMic("FALANDO");

    utterance.onend =
      () => {

        speaking = false;

        setState(
          "ATIVO",
          "JARVIS PRONTO"
        );

        setMic("OUVINDO");

        restartRecognition();

      };

    utterance.onerror =
      () => {

        speaking = false;

        setState(
          "ATIVO",
          "JARVIS PRONTO"
        );

        setMic("OUVINDO");

        restartRecognition();

      };

    speechSynthesis.speak(
      utterance
    );

  }catch{

    speaking = false;

    restartRecognition();

  }

}


/* =====================================================
   MICROFONE
===================================================== */

function createRecognition(){

  if(!SpeechRecognition){

    setMic(
      "NÃO SUPORTADO"
    );

    setState(
      "ERRO",
      "ESTE NAVEGADOR NÃO POSSUI SPEECH RECOGNITION"
    );

    return null;

  }

  const r =
    new SpeechRecognition();

  r.lang =
    "pt-BR";

  r.continuous =
    true;

  r.interimResults =
    true;

  r.maxAlternatives =
    1;


  r.onstart =
    () => {

      recognitionRunning =
        true;

      restarting =
        false;

      lastSpeechTime =
        Date.now();

      setState(
        "ATIVO",
        "JARVIS OUVINDO"
      );

      setMic("OUVINDO");

    };


  r.onaudiostart =
    () => {

      setMic(
        "MICROFONE OK"
      );

    };


  r.onspeechstart =
    () => {

      lastSpeechTime =
        Date.now();

      setMic(
        "VOZ DETECTADA"
      );

    };


  r.onresult =
    event => {

      lastSpeechTime =
        Date.now();

      let finalText = "";

      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        const result =
          event.results[i];

        const text =
          result[0]
            .transcript
            .trim();

        if(result.isFinal){

          finalText +=
            " " + text;

        }

      }

      finalText =
        finalText.trim();

      if(!finalText)
        return;

      processVoiceText(
        finalText
      );

    };


  r.onerror =
    event => {

      recognitionRunning =
        false;

      const error =
        event?.error || "";

      console.log(
        "JARVIS MIC ERROR:",
        error
      );

      if(
        error ===
        "not-allowed"
      ){

        setMic(
          "PERMISSÃO NEGADA"
        );

        setState(
          "ERRO",
          "PERMITA O MICROFONE NO NAVEGADOR"
        );

        return;

      }

      if(
        error ===
        "service-not-allowed"
      ){

        setMic(
          "SERVIÇO BLOQUEADO"
        );

        setState(
          "ERRO",
          "RECONHECIMENTO DE VOZ BLOQUEADO"
        );

        return;

      }

      setMic(
        "RECUPERANDO"
      );

      setState(
        "AGUARDANDO",
        "REINICIANDO MICROFONE"
      );

      scheduleRestart();

    };


  r.onend =
    () => {

      recognitionRunning =
        false;

      if(speaking)
        return;

      scheduleRestart();

    };


  return r;

}


/* =====================================================
   REINICIAR
===================================================== */

function scheduleRestart(){

  if(
    restarting ||
    speaking
  )
    return;

  restarting =
    true;

  setTimeout(
    () => {

      restarting =
        false;

      startRecognition();

    },
    700
  );

}


function startRecognition(){

  if(!recognition)
    recognition =
      createRecognition();

  if(!recognition)
    return;

  if(
    recognitionRunning ||
    speaking
  )
    return;

  try{

    recognition.start();

  }catch(error){

    console.log(
      "START ERROR:",
      error
    );

    recognitionRunning =
      false;

    scheduleRestart();

  }

}


function stopRecognition(){

  if(!recognition)
    return;

  try{
    recognition.stop();
  }catch{}

  recognitionRunning =
    false;

}


/* =====================================================
   PROCESSAR VOZ
===================================================== */

async function processVoiceText(
  text
){

  if(!text)
    return;

  console.log(
    "JARVIS OUVIU:",
    text
  );

  commandText.textContent =
    'OUVI: "' +
    text +
    '"';

  setState(
    "ANALISANDO",
    "PROCESSANDO COMANDO"
  );

  session.questions =
    Number(session.questions || 0) + 1;

  session.events =
    Array.isArray(session.events)
      ? session.events
      : [];

  session.events.push({

    type:"question",

    text:text,

    timestamp:
      new Date().toISOString()

  });

  saveSession();

  stopRecognition();

  const handled =
    await executeLocalCommand(
      text
    );

  if(handled)
    return;

  await askAI(text);

}


/* =====================================================
   COMANDOS LOCAIS
===================================================== */

async function executeLocalCommand(
  original
){

  const text =
    normalizeText(original);


  /* SAUDAÇÕES */

  if(
    /^(bom dia|boa tarde|boa noite|oi|ola|ola jarvis|oi jarvis|e ai|eai)$/
      .test(text)
  ){

    let response =
      "Boa noite, Fernando.";

    if(text.includes("bom dia"))
      response =
        "Bom dia, Fernando.";

    else if(
      text.includes("boa tarde")
    )
      response =
        "Boa tarde, Fernando.";

    speak(response);

    return true;

  }


  /* CRIADOR */

  if(
    text.includes("quem e seu criador") ||
    text.includes("quem te criou") ||
    text.includes("quem e seu dono") ||
    text.includes("quem criou voce") ||
    text.includes("quem e o seu criador")
  ){

    speak(
      "Meu criador e proprietário configurado é Fernando."
    );

    return true;

  }


  /* NOME */

  if(
    text === "qual seu nome" ||
    text.includes("seu nome")
  ){

    speak(
      "Meu nome é JARVIS."
    );

    return true;

  }


  /* HORA */

  if(
    text.includes("que horas") ||
    text.includes("qual a hora") ||
    text.includes("me diga a hora") ||
    text.includes("horas agora") ||
    text === "hora" ||
    text === "horario"
  ){

    const now =
      new Date();

    const time =
      now.toLocaleTimeString(
        "pt-BR",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );

    speak(
      `Agora são ${time}.`
    );

    return true;

  }


  /* DATA */

  if(
    text.includes("que dia e hoje") ||
    text.includes("qual a data") ||
    text.includes("data de hoje") ||
    text.includes("dia de hoje")
  ){

    const now =
      new Date();

    const date =
      now.toLocaleDateString(
        "pt-BR",
        {
          weekday:"long",
          day:"2-digit",
          month:"long",
          year:"numeric"
        }
      );

    speak(
      `Hoje é ${date}.`
    );

    return true;

  }


  /* STATUS */

  if(
    text.includes("status do sistema") ||
    text === "status" ||
    text.includes("como voce esta")
  ){

    speak(
      "Todos os sistemas principais estão ativos. Reconhecimento de voz funcionando e núcleo remoto disponível."
    );

    return true;

  }


  /* CÉREBRO */

  if(
    text.includes("mostre seu cerebro") ||
    text.includes("mostrar seu cerebro") ||
    text.includes("abrir cerebro") ||
    text.includes("analise do cerebro") ||
    text.includes("analise seu cerebro") ||
    text.includes("cerebro para analise")
  ){

    openBrain();

    speak(
      "Abrindo meu núcleo cerebral para análise."
    );

    return true;

  }


  /* FECHAR CÉREBRO */

  if(
    text.includes("fechar cerebro") ||
    text.includes("feche o cerebro") ||
    text.includes("voltar para tela principal")
  ){

    closeBrainPanel();

    speak(
      "Retornando para o núcleo principal."
    );

    return true;

  }


  /* YOUTUBE */

  if(
    text === "youtube" ||
    text.includes("abrir youtube")
  ){

    openWebsite(
      "https://www.youtube.com/"
    );

    return true;

  }


  /* PESQUISA YOUTUBE */

  if(
    text.startsWith(
      "pesquise no youtube "
    ) ||
    text.startsWith(
      "pesquisa no youtube "
    )
  ){

    const query =
      original
        .replace(
          /pesquise no youtube/i,
          ""
        )
        .replace(
          /pesquisa no youtube/i,
          ""
        )
        .trim();

    if(query){

      openWebsite(
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(query)
      );

    }

    return true;

  }


  /* GOOGLE */

  if(
    text === "google" ||
    text.includes("abrir google")
  ){

    openWebsite(
      "https://www.google.com/"
    );

    return true;

  }


  /* PESQUISA GOOGLE */

  if(
    text.startsWith(
      "pesquise no google "
    ) ||
    text.startsWith(
      "pesquisa no google "
    ) ||
    text.startsWith(
      "pesquise "
    )
  ){

    let query =
      original
        .replace(
          /pesquise no google/i,
          ""
        )
        .replace(
          /pesquisa no google/i,
          ""
        )
        .replace(
          /^pesquise/i,
          ""
        )
        .trim();

    if(query){

      openWebsite(
        "https://www.google.com/search?q=" +
        encodeURIComponent(query)
      );

    }

    return true;

  }


  /* WHATSAPP */

  if(
    text.includes("abrir whatsapp") ||
    text === "whatsapp"
  ){

    openWebsite(
      "https://web.whatsapp.com/"
    );

    return true;

  }


  /* INSTAGRAM */

  if(
    text.includes("abrir instagram") ||
    text === "instagram"
  ){

    openWebsite(
      "https://www.instagram.com/"
    );

    return true;

  }


  /* DISCORD */

  if(
    text.includes("abrir discord") ||
    text === "discord"
  ){

    openWebsite(
      "https://discord.com/app"
    );

    return true;

  }


  /* FACEBOOK */

  if(
    text.includes("abrir facebook") ||
    text === "facebook"
  ){

    openWebsite(
      "https://www.facebook.com/"
    );

    return true;

  }


  /* GMAIL */

  if(
    text.includes("abrir gmail") ||
    text === "gmail"
  ){

    openWebsite(
      "https://mail.google.com/"
    );

    return true;

  }


  /* MAPS */

  if(
    text.includes("abrir mapas") ||
    text.includes("abrir google maps") ||
    text === "mapas"
  ){

    openWebsite(
      "https://maps.google.com/"
    );

    return true;

  }


  /* SPOTIFY */

  if(
    text.includes("abrir spotify") ||
    text === "spotify"
  ){

    openWebsite(
      "https://open.spotify.com/"
    );

    return true;

  }


  /* MEMÓRIA */

  if(
    text.startsWith(
      "lembre que "
    ) ||
    text.startsWith(
      "lembre-se que "
    ) ||
    text.startsWith(
      "memorize que "
    ) ||
    text.startsWith(
      "guarde que "
    )
  ){

    let value =
      original
        .replace(
          /^lembre(-se)? que/i,
          ""
        )
        .replace(
          /^memorize que/i,
          ""
        )
        .replace(
          /^guarde que/i,
          ""
        )
        .trim();

    if(value){

      memory.push({

        text:value,

        at:
          new Date().toISOString(),

        source:
          "usuario"

      });

      saveMemory();

      speak(
        "Entendido. Guardei essa informação na minha memória."
      );

    }

    return true;

  }


  return false;

}


/* =====================================================
   ABRIR SITE
===================================================== */

function openWebsite(
  url
){

  try{

    const opened =
      window.open(
        url,
        "_blank"
      );

    if(
      !opened ||
      opened.closed ||
      typeof opened.closed === "undefined"
    ){

      window.location.href =
        url;

    }

  }catch{

    window.location.href =
      url;

  }

}


/* =====================================================
   IA / API
===================================================== */

async function askAI(
  text
){

  setState(
    "PROCESSANDO",
    "CONSULTANDO O NÚCLEO DE INTELIGÊNCIA"
  );

  setMic(
    "PROCESSANDO"
  );


  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      () => controller.abort(),
      30000
    );


  try{

    /* ATUALIZA SESSÃO */

    session.answers =
      Number(session.answers || 0);

    saveSession();


    /* ENVIA PARA O BACKEND */

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                text,

              memory:
                memory,

              /* ALTERAÇÃO IMPORTANTE */
              knowledge:
                knowledge,

              /* SESSÃO COMPLETA */
              session:
                session,

              /* DATA/HORA DO CELULAR */
              clientDateTime:
                new Date().toString(),

              /* FUSO HORÁRIO */
              clientTimeZone:
                Intl.DateTimeFormat()
                  .resolvedOptions()
                  .timeZone

            }),

          signal:
            controller.signal

        }
      );


    const raw =
      await response.text();

    let data = {};

    try{

      data =
        raw ? JSON.parse(raw) : {};

    }catch{

      data = {
        error:
          raw || "Resposta inválida do servidor."
      };

    }


    if(!response.ok){

      throw new Error(
        data?.error ||
        `Erro HTTP ${response.status}`
      );

    }


    const answer =
      String(
        data?.answer ||
        "Não consegui gerar uma resposta agora."
      )
      .trim();


    /* MEMÓRIA */

    if(
      data?.memoryToSave
    ){

      memory.push({

        text:
          String(
            data.memoryToSave
          ).trim(),

        at:
          new Date().toISOString(),

        source:
          "jarvis"

      });

      saveMemory();

    }


    /* SESSÃO */

    session.answers =
      Number(session.answers || 0) + 1;

    session.events.push({

      type:"answer",

      timestamp:
        new Date().toISOString()

    });

    saveSession();


    setState(
      "RESPOSTA RECEBIDA",
      "NÚCLEO DE INTELIGÊNCIA ONLINE"
    );


    speak(answer);


  }catch(error){

    console.error(
      "JARVIS API ERROR:",
      error
    );


    if(
      error?.name ===
      "AbortError"
    ){

      speak(
        "A solicitação demorou demais para responder."
      );

    }else{

      speak(
        "Não consegui acessar o núcleo remoto agora."
      );

    }

    setState(
      "ERRO",
      "FALHA NA COMUNICAÇÃO COM O NÚCLEO"
    );

  }finally{

    clearTimeout(
      timeout
    );

  }

}


/* =====================================================
   BRAIN
===================================================== */

function openBrain(){

  updateBrainPanel();

  brainPanel.style.display =
    "block";

}


function closeBrainPanel(){

  brainPanel.style.display =
    "none";

}


closeBrain.onclick =

function updateBrainPanel(){

  document.getElementById(
    "knownCount"
  ).textContent =
    knowledge.known.length;

  document.getElementById(
    "learnedCount"
  ).textContent =
    knowledge.learned.length;

  document.getElementById(
    "learningCount"
  ).textContent =
    knowledge.learning.length;

  document.getElementById(
    "unknownCount"
  ).textContent =
    knowledge.unknown.length;


  renderList(
    "knownList",
    knowledge.known
  );

  renderList(
    "learnedList",
    knowledge.learned
  );

  renderList(
    "learningList",
    knowledge.learning
  );

  renderList(
    "unknownList",
    knowledge.unknown
  );

}


function renderList(
  id,
  items
){

  const element =
    document.getElementById(id);

  if(!items.length){

    element.innerHTML =
      '<div class="item">Nenhum registro.</div>';

    return;

  }


  element.innerHTML =
    items
      .slice(-30)
      .reverse()
      .map(
        item => {

          const text =
            typeof item === "string"
              ? item
              : item.topic ||
                item.text ||
                JSON.stringify(item);

          return `
            <div class="item">
              ${escapeHTML(text)}
            </div>
          `;

        }
      )
      .join("");

}


function escapeHTML(
  text
){

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

/* =====================================================
   CANVAS — ESPAÇO
===================================================== */

const space =
  document.getElementById(
    "space"
  );

const sctx =
  space.getContext("2d");

let stars = [];


function resizeSpace(){

  space.width =
    innerWidth *
    devicePixelRatio;

  space.height =
    innerHeight *
    devicePixelRatio;

  sctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );

  stars = [];

  for(
    let i=0;
    i<120;
    i++
  ){

    stars.push({

      x:
        Math.random() *
        innerWidth,

      y:
        Math.random() *
        innerHeight,

      r:
        Math.random() *
        1.2,

      a:
        Math.random()

    });

  }

}


function drawSpace(){

  sctx.clearRect(
    0,
    0,
    innerWidth,
    innerHeight
  );

  for(
    const star of stars
  ){

    sctx.globalAlpha =
      star.a;

    sctx.fillStyle =
      "#8defff";

    sctx.beginPath();

    sctx.arc(
      star.x,
      star.y,
      star.r,
      0,
      Math.PI*2
    );

    sctx.fill();

  }

  sctx.globalAlpha =
    1;

  requestAnimationFrame(
    drawSpace
  );

}


window.addEventListener(
  "resize",
  resizeSpace
);

resizeSpace();
drawSpace();


/* =====================================================
   CÉREBRO DE PARTÍCULAS
===================================================== */

const brainCanvas =
  document.getElementById(
    "brain"
  );

const bctx =
  brainCanvas.getContext("2d");

let particles = [];

function resizeBrain(){

  const rect =
    brainCanvas.getBoundingClientRect();

  brainCanvas.width =
    rect.width *
    devicePixelRatio;

  brainCanvas.height =
    rect.height *
    devicePixelRatio;

  bctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );

  particles = [];

  const count =
    Math.min(
      420,
      Math.floor(
        rect.width * .9
      )
    );

  for(
    let i=0;
    i<count;
    i++
  ){

    const angle =
      Math.random() *
      Math.PI *
      2;

    const radius =
      Math.sqrt(
        Math.random()
      ) * rect.width * .27;

    particles.push({

      x:
        Math.cos(angle) *
        radius,

      y:
        Math.sin(angle) *
        radius * .72,

      z:
        Math.random(),

      size:
        .5 +
        Math.random()*1.4,

      phase:
        Math.random()*Math.PI*2

    });

  }

}


function drawBrain(
  time
){

  const w =
    brainCanvas.clientWidth;

  const h =
    brainCanvas.clientHeight;

  bctx.clearRect(
    0,
    0,
    w,
    h
  );

  const cx =
    w/2;

  const cy =
    h/2;

  const rotation =
    time * .00025;


  for(
    const p of particles
  ){

    const x =
      p.x *
      Math.cos(rotation) -
      p.y *
      Math.sin(rotation);

    const y =
      p.x *
      Math.sin(rotation) +
      p.y *
      Math.cos(rotation);


    const pulse =
      1 +
      Math.sin(
        time*.003 +
        p.phase
      )*.12;


    bctx.globalAlpha =
      .25 +
      p.z*.65;

    bctx.fillStyle =
      "#63f4ff";

    bctx.beginPath();

    bctx.arc(
      cx + x,
      cy + y,
      p.size*pulse,
      0,
      Math.PI*2
    );

    bctx.fill();

  }

  bctx.globalAlpha =
    1;

  requestAnimationFrame(
    drawBrain
  );

}


window.addEventListener(
  "resize",
  resizeBrain
);

resizeBrain();

requestAnimationFrame(
  drawBrain
);
